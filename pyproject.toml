[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repeat-neraca"
version = "0.2.0"
description = "Neraca air (water balance) of a KHG for RE-PEAT: climatic balance per sub-KHG, KHG deficit, physical model and synthetic testbed"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas>=2.0", "pydantic>=2", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]
benchmark = ["rasterio", "pandas"]
# real KHG inputs (repeat_neraca.groundwater.grid) and the physical-model runner
neraca = ["rasterio", "geopandas", "pandas", "pyproj", "shapely"]
# SiTMAT station files (repeat_neraca.stations) and the ERA5 forcing route read through repeat-common
sitmat = ["repeat-common", "geopandas"]
# Earth Engine fetch and the batch runner (repeat_common.fetch_gee_balance, repeat_neraca.batch); needs `earthengine authenticate` and EE_PROJECT
gee = ["repeat-common[gee]", "geopandas"]
all = ["repeat-neraca[neraca,sitmat,gee]"]

[project.scripts]
repeat-neraca-balance = "repeat_neraca.balance:main"       # climatic balance per sub-KHG
repeat-neraca-batch = "repeat_neraca.batch:main"           # fetch + balance for a list of KHG, or all
repeat-neraca-stations = "repeat_neraca.stations:main"     # SiTMAT station files
repeat-neraca-run = "repeat_neraca.run:main"               # KHG deficit and the physical model (diagnostic)
repeat-neraca-map = "repeat_neraca.maps:main"              # map layers: balance per sub-KHG, SiTMAT stations
repeat-neraca-model = "repeat_neraca.model:main"           # groundwater model of a KHG, scored against field points

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repeat_neraca = ["groundwater/data/*", "parameters.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
